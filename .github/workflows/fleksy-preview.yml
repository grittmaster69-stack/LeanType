name: Fleksy punctuation preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/fleksy-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEANTYPE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Test keyboard gestures
        run: ./gradlew testStandardDebugUnitTest --tests '*FleksyPunctuationCycleTest' --tests '*InputLogicTest.fleksy*' --tests '*SwipeWordDeleteRepeaterTest'
      - name: Restore permanent signing key when configured
        env:
          SIGNING_KEY_BASE64: ${{ secrets.LEANTYPE_SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            umask 077
            keyfile="$RUNNER_TEMP/leantype-update.jks"
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$keyfile"
            keytool -exportcert -keystore "$keyfile" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/leantype-certificate.der"
            actual="$(sha256sum "$RUNNER_TEMP/leantype-certificate.der" | cut -d ' ' -f 1)"
            test "$actual" = "49895c18783e59aa1b1d229d1edde0276a5015340f6d8dd5b175d2afd6c4a7be"
            echo "LEANTYPE_KEYSTORE_FILE=$keyfile" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        run: ./gradlew assembleStandardDebug
      - name: Prepare artifact for permanent signing
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/standard/debug/*.apk delivery/
          if [ -z "${LEANTYPE_KEYSTORE_FILE:-}" ]; then
            signer="$(rg --files "$ANDROID_HOME/build-tools" -g apksigner.jar | sort -V | tail -n 1)"
            test -n "$signer"
            cp "$signer" delivery/apksigner.jar
            echo "Requires signing with the retained personal keystore before distribution." > delivery/LOCAL-SIGNING-REQUIRED.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LeanType-build
          path: delivery/
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/leantype-update.jks"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Fleksy-test-reports
          path: app/build/reports
